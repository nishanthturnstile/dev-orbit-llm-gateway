name: CI policy gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-policy:
    name: Config policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run LiteLLM config verifier
        run: sh services/litellm/scripts/verify-config.sh

      - name: Run PowerShell config policy lint
        shell: pwsh
        run: ./scripts/lint-litellm-config.ps1

      - name: Collect smoke tests
        run: python -m pytest tests/smoke --collect-only -q

      - name: Validate smoke tests skip safely
        run: python -m pytest tests/smoke -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run secret scan
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run repository hygiene checks
        shell: pwsh
        run: ./scripts/lint-litellm-config.ps1

      - name: Check shell syntax
        run: |
          bash -n services/litellm/scripts/verify-config.sh
          bash -n services/backup-worker/scripts/backup-postgres.sh
          bash -n services/backup-worker/scripts/restore-check.sh
