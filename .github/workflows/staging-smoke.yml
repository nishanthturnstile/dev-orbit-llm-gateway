name: Staging smoke skeleton

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skeleton:
    name: Validate smoke skeleton
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate smoke script shape
        shell: pwsh
        run: ./scripts/smoke-railway.ps1 -ValidateOnly
