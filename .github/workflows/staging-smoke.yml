name: Staging smoke skeleton

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skeleton:
    name: Validate smoke skeleton
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate smoke script shape
        shell: pwsh
        run: ./scripts/smoke-railway.ps1 -ValidateOnly

      - name: Validate Phase 6 public-origin validator shape
        shell: pwsh
        run: ./scripts/phase6-validate-public-origin.ps1 -ValidateOnly
