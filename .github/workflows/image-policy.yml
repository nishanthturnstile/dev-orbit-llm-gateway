name: Image policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-policy:
    name: Image policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Enforce image and workflow policy
        shell: pwsh
        run: ./scripts/lint-litellm-config.ps1
