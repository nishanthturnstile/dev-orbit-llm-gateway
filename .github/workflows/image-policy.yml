name: Image policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-policy:
    name: Image policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Enforce image and workflow policy
        shell: pwsh
        run: ./scripts/lint-litellm-config.ps1
