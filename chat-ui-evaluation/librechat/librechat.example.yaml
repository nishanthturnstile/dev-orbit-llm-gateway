# Placeholder-only LibreChat config for staging evaluation.
# Do not commit real keys, domains, private hostnames, or provider endpoints.
# Keep embedding-only aliases out of chat model lists.

version: 1.3.12
cache: true

endpoints:
  custom:
    - name: "LiteLLM Staging"
      apiKey: "${LITELLM_UI_API_KEY}"
      baseURL: "${LITELLM_BASE_URL}"
      models:
        default:
          - "dev-fast"
          - "dev-code"
          - "dev-reasoning"
          - "dev-long-horizon"
      titleConvo: true
      titleModel: "dev-fast"
      summarize: true
      summaryModel: "dev-fast"

interface:
  endpointsMenu: true
  modelSelect: true
  parameters: false

registration:
  socialLogins: []
