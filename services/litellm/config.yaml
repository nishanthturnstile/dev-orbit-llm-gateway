model_list:
  - model_name: dev-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 60
      num_retries: 2
    model_info:
      mode: chat

  - model_name: dev-code
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 90
      num_retries: 1
    model_info:
      mode: chat

  - model_name: dev-reasoning
    litellm_params:
      model: openai/o4-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 180
      num_retries: 0
    model_info:
      mode: chat

  - model_name: dev-long-context
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 180
      num_retries: 0
    model_info:
      mode: chat

  - model_name: batch-analysis
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 180
      num_retries: 1
    model_info:
      mode: chat

  - model_name: dev-search
    litellm_params:
      model: perplexity/sonar
      api_key: os.environ/PERPLEXITY_API_KEY
      timeout: 90
      num_retries: 1
    model_info:
      mode: chat

  - model_name: dev-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      timeout: 60
      num_retries: 1
    model_info:
      mode: embedding

  - model_name: dev-vision
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120
      num_retries: 1
    model_info:
      mode: chat

litellm_settings:
  request_timeout: 90
  num_retries: 1
  turn_off_message_logging: true
  redact_user_api_key_info: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
